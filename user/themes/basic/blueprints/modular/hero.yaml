title: Hero
'@extends': default
form:
  fields:
    tabs:
      fields:
        hero:
          type: tab
          title: Hero
          fields:
            global_settings:
              type: section
              title: 'Global Setting'
              underline: true
              collapsible: true
              collapsed: false
              fields:
                header.columns:
                  type: select
                  label: 'Number of columns'
                  help: 'The hero content columns shown on desktop.'
                  default: 2
                  options:
                    1: '1 column'
                    2: '2 columns'
                    3: '3 columns'
                header.content_alignment:
                  type: select
                  label: 'Content alignment'
                  default: left
                  options:
                    left: Left
                    center: Center
                    right: Right
                header.vertical_alignment:
                  type: select
                  label: 'Vertical alignment'
                  default: center
                  options:
                    start: Top
                    center: Center
                    end: Bottom
                header.background_style:
                  type: select
                  label: 'Background style'
                  default: solid
                  options:
                    solid: 'Solid color'
                    image: 'Background image'
                header.background_color:
                  type: colorpicker
                  label: 'Background color'
                  default: '#ffffff'
                  help: 'Used when the background style is Solid color.'
                header.background_image:
                  type: media
                  label: 'Background image'
                  sources:
                    - page
                    - site
                  accept:
                    - 'image/*'
                  help: "Optional image from this module's media or the site media library. Used when Background style is Background image."
                header.background_overlay:
                  type: range
                  label: 'Background image overlay'
                  default: 35
                  validate:
                    min: 0
                    max: 80
            header.columns_content.column_1:
              type: section
              title: 'Column 1'
              underline: true
              collapsible: true
              collapsed: false
              fields:
                .blocks:
                  name: blocks
                  type: list
                  label: Blocks
                  help: 'Add and arrange blocks in Column 1.'
                  style: vertical
                  collapsible: true
                  collapsed: true
