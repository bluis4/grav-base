form:
  fields: { base/text: { type: element, fields: { .name: { type: text, label: 'Block name', placeholder: 'e.g. Hero heading', help: 'Editor-only label used to identify this block. It is never rendered on the site.', default: '' }, .content: { type: textarea, label: Content, help: 'The text displayed on the site.', default: '' }, .tag: { type: select, label: 'HTML tag', help: 'Element used to render the content. Pick a heading for titles so the page keeps a sensible outline.', default: p, options: { p: Paragraph, h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3', h4: 'Heading 4', h5: 'Heading 5', h6: 'Heading 6', span: Span, div: Div } }, .font_size: { type: select, label: 'Font size', default: text-base, options: { text-xs: 'text-xs (0.75rem)', text-sm: 'text-sm (0.875rem)', text-base: 'text-base (1rem)', text-lg: 'text-lg (1.125rem)', text-xl: 'text-xl (1.25rem)', text-2xl: 'text-2xl (1.5rem)', text-3xl: 'text-3xl (1.875rem)', text-4xl: 'text-4xl (2.25rem)' } }, .color: { type: colorpicker, label: 'Font color', help: 'Leave blank to inherit the surrounding color.' }, .margin: { type: text, label: Margin, help: 'Spacing in top,bottom,left,right order, e.g. 0,10,0,0 (numbers = Tailwind spacing units) or full classes like mt-4,mb-6,ml-0,mr-0.', default: '' }, .padding: { type: text, label: Padding, help: 'Spacing in top,bottom,left,right order, e.g. 2,4,2,4 (numbers = Tailwind spacing units) or full classes like pt-4,pb-6,pl-0,pr-0.', default: '' }, .alignment: { type: select, label: Alignment, default: left, options: { left: Left, center: Center, right: Right, justify: Justify } }, .style: { type: text, label: 'Style classes', help: 'Optional custom Tailwind or daisyUI classes for this block.', default: '' } } } }
