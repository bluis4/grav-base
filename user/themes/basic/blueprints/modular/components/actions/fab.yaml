form:
  fields:
    actions/fab:
      type: element
      fields:
        .fab_title:
          type: text
          label: FAB Title
          default: Main action
          help: Text shown on the main FAB trigger button.
        .fab_icon:
          type: bootstrapiconpicker
          label: FAB icon
          default: bi-plus-lg
          help: Optional icon for the main FAB trigger. Leave empty to show the title text instead.
        .fab_mode:
          type: select
          label: Mode
          default: fab
          options:
            fab: FAB only
            speed_dial: FAB + Speed Dial
        .fab_link_settings:
          type: conditional
          condition: "actions/fab.fab_mode == 'fab'"
          fields:
            .fab_link_source:
              type: elements
              label: Link destination
              default: custom
              options:
                page: Choose a page
                custom: Custom URL
              fields:
                page:
                  type: element
                  fields:
                    .fab_page:
                      type: pages
                      label: Page
                      show_root: true
                      show_modular: false
                      multiple: false
                custom:
                  type: element
                  fields:
                    .fab_custom_url:
                      type: url
                      label: Custom URL
                      placeholder: https://example.com or /contact
            .fab_url_behavior:
              type: select
              label: URL behavior
              default: same
              options:
                same: Open in the same tab
                new_tab: Open in a new tab
                new_window: Open in a new window
        .fab_position:
          type: select
          label: Position
          default: inline
          options:
            inline: Inline (inside the column)
            fixed: Fixed (floating bottom-right)
          help: Inline keeps the FAB in its column with the other components. Fixed pins it to the bottom-right corner of the viewport, above the back-to-top button.
        .speed_dial_settings:
          type: conditional
          condition: "actions/fab.fab_mode == 'speed_dial'"
          fields:
            .fab_style:
              type: select
              label: Speed dial style
              default: vertical
              options:
                vertical: Vertical
                quarter_circle: Quarter Circle
              help: Vertical stacks the buttons in a column. Quarter circle arranges them in a flower shape.
            .items:
              name: items
              type: list
              label: Speed dial buttons
              btnLabel: Add speed dial button
              fields:
                .item_label:
                  type: text
                  label: Speed dial label
                  help: Leave empty to hide the label.
                .item_type:
                  type: select
                  label: Speed type
                  default: text
                  options:
                    text: Text
                    icon: Icon
                .item_text_fields:
                  type: conditional
                  condition: "item_type == 'text'"
                  fields:
                    .item_text:
                      type: text
                      label: Button text
                .item_icon_fields:
                  type: conditional
                  condition: "item_type == 'icon'"
                  fields:
                    .item_icon:
                      type: bootstrapiconpicker
                      label: Button icon
                      default: bi-arrow-right
                      help: Bootstrap Icons must be enabled in Theme Configuration -> Miscellaneous -> Enable Bootstrap Icons.
                .item_link_source:
                  type: elements
                  label: Link destination
                  default: custom
                  options:
                    page: Choose a page
                    custom: Custom URL
                  fields:
                    page:
                      type: element
                      fields:
                        .item_page:
                          type: pages
                          label: Page
                          show_root: true
                          show_modular: false
                          multiple: false
                    custom:
                      type: element
                      fields:
                        .item_custom_url:
                          type: url
                          label: Custom URL
                          placeholder: https://example.com or /contact
                .item_url_behavior:
                  type: select
                  label: URL behavior
                  default: same
                  options:
                    same: Open in the same tab
                    new_tab: Open in a new tab
                    new_window: Open in a new window
