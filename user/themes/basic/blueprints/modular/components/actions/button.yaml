form:
  fields: { actions/button: { type: element, fields: { .button_text: { type: textarea, label: 'Button text', help: 'HTML is allowed for inline markup such as a daisyUI badge. Only enter trusted HTML.' }, .button_style: { type: select, label: 'Button style', default: btn-primary, options: { btn-primary: Primary, btn-secondary: Secondary, btn-accent: Accent, btn-neutral: Neutral, btn-outline: Outline, btn-ghost: Ghost, btn-link: Link } }, .button_color: { type: colorpicker, label: 'Button color', help: 'Optional custom background color. Leave blank to use the selected daisyUI button style.' }, .button_text_color: { type: colorpicker, label: 'Button text color', help: 'Optional custom text color.' }, .button_use_icon: { type: toggle, label: 'Show icon', highlight: 1, default: 0, options: { 1: PLUGIN_ADMIN.YES, 0: PLUGIN_ADMIN.NO }, validate: { type: bool } }, .button_icon: { type: bootstrapiconpicker, label: 'Bootstrap icon', default: bi-arrow-right, help: 'Bootstrap Icons must be enabled in Theme Configuration → Miscellaneous → Enable Bootstrap Icons. The icon is hidden on the site when that setting is disabled.' }, .button_icon_position: { type: select, label: 'Icon position', default: left, options: { left: Left, right: Right } }, .button_size: { type: select, label: 'Button size', default: btn-md, options: { btn-xs: 'Extra small', btn-sm: Small, btn-md: Medium, btn-lg: Large, btn-xl: 'Extra large' }, help: 'Button size follows the daisyUI button size classes.' }, .button_link_source: { type: elements, label: 'Link destination', default: custom, options: { page: 'Choose a page', custom: 'Custom URL' }, fields: { page: { type: element, fields: { .button_page: { type: pages, label: Page, show_root: true, show_modular: false, multiple: false } } }, custom: { type: element, fields: { .button_custom_url: { type: url, label: 'Custom URL', placeholder: 'https://example.com or /contact' } } } } }, .button_url_behavior: { type: select, label: 'URL behavior', default: same, options: { same: 'Open in the same tab', new_tab: 'Open in a new tab', new_window: 'Open in a new window' } }, .button_extra_classes: { type: text, label: 'Style classes', help: 'Add custom CSS or daisyUI classes for this button.' } } } }
